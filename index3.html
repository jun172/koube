<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神戸市SNS分析ダッシュボード</title>
    <!-- D3.js ライブラリ -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; background-color: #131314; color: #e3e3e3; font-family: 'Roboto', sans-serif; }
        .app-container { display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 260px; background-color: #1e1f20; padding: 20px; border-right: 1px solid #333; }
        .sidebar li { padding: 12px 15px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-bottom: 5px; list-style: none; }
        .sidebar li:hover { background-color: #333537; }

        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        #mainDisplayArea { flex: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        
        .analysis-card { background-color: #1e1f20; padding: 25px; border-radius: 16px; border: 1px solid #333; max-width: 800px; width: 100%; margin-bottom: 24px; box-sizing: border-box; }
        .post-item { border-bottom: 1px solid #333; padding: 12px 0; display: flex; flex-direction: column; }
        .post-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .like-count { color: #8ab4f8; font-weight: bold; }

        /* 下部入力エリア */
        .bottom-input-section { padding: 20px 40px 40px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .tag-container { display: flex; gap: 10px; justify-content: center; }
        .tag { background-color: #282a2c; padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 1px solid #444746; }
        .search-container { position: relative; width: 100%; max-width: 600px; }
        .search-input { width: 100%; padding: 18px 24px; padding-right: 60px; border-radius: 30px; border: 1px solid #444746; background: #1e1f20; color: #e3e3e3; outline: none; box-sizing: border-box; }
        .search-icon-button { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: #8ab4f8; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }

        /* ツリーコンテナ＆What/Why/How切り替えタブ */
        .tree-container { margin-top: 15px; padding: 15px; background-color: #282a2c; border-radius: 8px; border: 1px solid #444746; }
        .tree-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .tree-tabs { display: flex; gap: 6px; }
        .tree-tab-btn { background-color: #1e1f20; color: #aaa; border: 1px solid #444746; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        .tree-tab-btn.active { background-color: #8ab4f8; color: #131314; font-weight: bold; border-color: #8ab4f8; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h3 style="margin-top:0;">検索履歴</h3>
            <ul style="padding:0;">
                <li>神戸市 不満</li>
                <li>三ノ宮 交通</li>
            </ul>
        </aside>

        <main class="main-content">
            <div id="mainDisplayArea"></div>
            <div class="bottom-input-section">
                <div class="tag-container">
                    <span class="tag" onclick="addTagToSearch('#神戸市')">#神戸市</span>
                    <span class="tag" onclick="addTagToSearch('#不満')">#不満</span>
                </div>
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="分析キーワードを入力..." class="search-input">
                    <button class="search-icon-button" onclick="executeSearch()">🔍</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        function addTagToSearch(tag) {
            const input = document.getElementById('searchInput');
            input.value = (input.value ? input.value + ' ' : '') + tag;
        }

        function executeSearch() {
            const query = document.getElementById('searchInput').value;
            if(!query) return;

            const displayArea = document.getElementById('mainDisplayArea');
            displayArea.innerHTML += `
                <div class="analysis-card">
                    <h4>検索結果: ${query}</h4>
                    <div class="post-item">
                        <div class="post-header" onclick="toggleLogicTree(this, '駅混雑')">
                            <span style="text-decoration:underline;">「三ノ宮駅の混雑、なんとかならないか」</span> 
                            <span class="like-count">1,240 いいね</span>
                        </div>
                    </div>
                    <div class="post-item">
                        <div class="post-header" onclick="toggleLogicTree(this, '役所対応')">
                            <span style="text-decoration:underline;">「市役所の対応が遅いと感じる」</span> 
                            <span class="like-count">850 いいね</span>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('searchInput').value = '';
            displayArea.scrollTop = displayArea.scrollHeight;
        }

        // --- ロジックツリーデータ（What / ネガティブ / ポジティブ） ---
        const treeDataStore = {
            '駅混雑': {
                'What': {
                    name: "三ノ宮駅混雑",
                    children: [
                        { name: "構内ボトルネック", children: [{name: "改札口の集中"}, {name: "階段の狭さ"}] },
                        { name: "時間帯偏重", children: [{name: "朝ピーク時 (8時台)"}, {name: "イベント開催時"}] }
                    ]
                },
                'ネガティブ': {
                    children: [
                        { name: "構造的要因", children: [{name: "旧構造のまま拡張不能"}] },
                        { name: "運用的要因", children: [{name: "振替路線の案内不足"}] }
                    ]
                },
                'ポジティブ': {
                    name:'',
                    children: [
                        { name: "ハード対策", children: [{name: "改札増設"}, {name: "導線分離"}] },
                        { name: "ソフト対策", children: [{name: "時差通勤の推進"}, {name: "デジタル看板"}] }
                    ]
                }
            },
            '役所対応': {
                'What': {
                    name: "市役所対応",
                    children: [
                        { name: "待ち時間", children: [{name: "窓口混雑"}] },
                        { name: "手続きの複雑さ", children: [{name: "紙申請の多さ"}] }
                    ]
                },
                'Why': {
                    name: "なぜ遅いのか",
                    children: [
                        { name: "システム要因", children: [{name: "レガシーシステム利用"}] },
                        { name: "人員要因", children: [{name: "繁忙期の職員不足"}] }
                    ]
                },
                'How': {
                    name: "どう解決するか",
                    children: [
                        { name: "DX推進", children: [{name: "オンライン申請化"}] },
                        { name: "窓口改革", children: [{name: "事前予約制導入"}] }
                    ]
                }
            }
        };

        // --- D3.js 描画関数 ---
        function drawTree(container, topicKey, treeType) {
            d3.select(container).select("svg").remove();

            const rawData = treeDataStore[topicKey] && treeDataStore[topicKey][treeType] 
                ? treeDataStore[topicKey][treeType]
                : { name: topicKey, children: [{ name: "解析データなし" }] };

            const width = 480, height = 180;
            const svg = d3.select(container)
                .append("svg")
                .attr("width", width)
                .attr("height", height)
                .append("g")
                .attr("transform", "translate(90,0)");

            const root = d3.hierarchy(rawData);
            d3.tree().size([height - 20, width - 220])(root);

            // リンク線描画
            svg.selectAll(".link")
                .data(root.links())
                .enter().append("path")
                .attr("fill", "none")
                .attr("stroke", "#8ab4f8")
                .attr("stroke-width", 1.5)
                .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));

            // ノード描画
            const node = svg.selectAll(".node")
                .data(root.descendants())
                .enter().append("g")
                .attr("transform", d => `translate(${d.y},${d.x})`);

            node.append("circle").attr("r", 4).attr("fill", "#ffffff");
            node.append("text")
                .attr("dy", 3)
                .attr("x", 8)
                .attr("font-size", "11px")
                .attr("fill", "#e3e3e3")
                .text(d => d.data.name);
        }

        // --- タブ切り替え処理 ---
        function switchTreeTab(button, topicKey, treeType) {
            const container = button.closest('.tree-container');
            
            // アクティブなボタンの表示切り替え
            container.querySelectorAll('.tree-tab-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');

            // 再描画
            const canvas = container.querySelector('.tree-canvas');
            drawTree(canvas, topicKey, treeType);
        }

        // --- ツリー表示トグル ---
        function toggleLogicTree(headerElement, topicKey) {
            const parent = headerElement.parentElement;
            let treeContainer = parent.querySelector('.tree-container');
            
            if (treeContainer) {
                treeContainer.remove();
                return;
            }

            treeContainer = document.createElement('div');
            treeContainer.className = 'tree-container';
            treeContainer.innerHTML = `
                <div class="tree-header">
                    <div class="tree-tabs">
                        <button class="tree-tab-btn active" onclick="switchTreeTab(this, '${topicKey}', 'What')">What (要素分解)</button>
                        <button class="tree-tab-btn" onclick="switchTreeTab(this, '${topicKey}', 'Why')">ポジティブ </button>
                        <button class="tree-tab-btn" onclick="switchTreeTab(this, '${topicKey}', 'How')">ネガティブ</button>
                    </div>
                </div>
                <div class="tree-canvas"></div>
            `;
            parent.appendChild(treeContainer);

            // 初期表示はWhatツリー
            const canvas = treeContainer.querySelector('.tree-canvas');
            drawTree(canvas, topicKey, 'What');
        }
    </script>
</body>
</html>
